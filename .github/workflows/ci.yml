# Native CTest (headless Qt compile-check when CYPHA_BUILD_QT=ON).
#
# Blocking jobs: Linux fast CTest, Windows MSVC build, macOS hp/CyphaLM smokes.
# Optional: federated TLS smoke (OpenSSL; continue-on-error).
# Optional: corpus_and_d25 (WikiText fetch + corpus smokes; continue-on-error).
#
# Default PR gate: scripts/ci_native_fast.sh (ctest -R native_ -LE cypha_slow).
# Full maintainer gate: scripts/ci_native_linux.sh (all native_ tests).
# Production overnight tier (300k train) is NOT run in CI.
# CUDA is optional for local builds only (see docs/native/ACCEL_CUDA.md).
#
# Parity fixtures live under fixtures/ (regenerate offline if core math changes).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev libz-dev qt6-base-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1-mesa-dri libglib2.0-0
      - name: Native build + fast CTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCYPHA_BUILD_QT=ON -DCYPHA_HP_PROFILE=light
          cmake --build native/build -j 2
          bash scripts/ci_native_fast.sh
        # Local equivalent: bash scripts/ci_native_fast.sh (after configure/build)

  windows_msvc:
    name: Build (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup MSVC + Ninja
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        run: choco install ninja -y
      - name: Configure + build (MSVC Release)
        shell: cmd
        run: |
          cmake -S native -B native/build-msvc-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCYPHA_HP_PROFILE=light
          cmake --build native/build-msvc-release --parallel
      - name: Verify MSVC build artifacts
        shell: powershell
        run: |
          Get-ChildItem native\build-msvc-release -Filter *.exe | Sort-Object Name | Select-Object -ExpandProperty Name
          $need = @(
            'cypha_rest.exe','cypha_bench_run.exe','cypha_bench_report.exe',
            'cypha_diagnostics_run.exe','cypha_tune_run.exe','cyphalm_bench_native.exe'
          )
          foreach ($b in $need) {
            if (-not (Test-Path "native\build-msvc-release\$b")) { throw "Missing $b" }
          }

  build_and_test_macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Native build + hp/CyphaLM smokes
        run: |
          cmake -S native -B native/build-macos -DCMAKE_BUILD_TYPE=Release -DCYPHA_HP_PROFILE=light
          cmake --build native/build-macos -j 3
          CYPHA_NATIVE_BUILD_DIR="$PWD/native/build-macos" bash scripts/ci_native_hp_smoke.sh
        # AppleClang / libc++; HP_XSIMD stays OFF (portable scalar hp path).

  federated_tls:
    name: Federated TLS smoke (OpenSSL, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install OpenSSL toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev openssl
      - name: Federated TLS CTest (OpenSSL)
        run: bash scripts/ci_federated_tls_linux.sh
        # Local equivalent: bash scripts/ci_federated_tls_linux.sh

  corpus_and_d25:
    name: Corpus + d25 smoke (WikiText, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev libz-dev unzip
      - name: Download WikiText-2 (best effort)
        run: bash scripts/download_wikitext2.sh || true
      - name: Native build + corpus CTests
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCYPHA_HP_PROFILE=light
          cmake --build native/build -j 2
          ctest --test-dir native/build --output-on-failure -R "native_corpus_smoke|native_d25_corpus_smoke"
        # Local equivalent: bash scripts/download_wikitext2.sh; ctest -R "native_corpus_smoke|native_d25_corpus_smoke"
