# Build Linux + Windows (MinGW cross) native release archives and publish a GitHub Release on tag push.
# Native-only assets — no Python venv. Linux also ships a Qt AppImage (cypha_qt_shell + cypha_rest).
#
# Create a release:
#   git tag v2.0.0
#   git push origin v2.0.0
#
# Artifacts:
#   cypha-<version>-linux-x86_64.tar.gz
#   cypha-<version>-linux-x86_64.AppImage
#   cypha-<version>-windows-x86_64.zip
#
# Phase 7 (v2.3.7+): maintainer may also attach bench/BASELINE_LOCK.json snapshot
# or overnight result JSON via scripts/publish_release.ps1 after local gh auth.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-linux:
    name: Linux x86_64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + Qt + AppImage deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build g++ libsqlite3-dev \
            qt6-base-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1-mesa-dri libglib2.0-0 \
            wget file patchelf libfuse2 fuse

      - name: Configure + build (Release, Qt shell)
        run: |
          cmake -S native -B native/build-release \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCYPHA_BUILD_QT=ON \
            -G Ninja
          cmake --build native/build-release --parallel

      - name: Smoke CTest (native suite + bench runner)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir native/build-release -R native_cyphalm_parity_suite --output-on-failure
          ctest --test-dir native/build-release -R native_bench_run_list_domains --output-on-failure

      - name: Smoke CLI (release binaries)
        run: |
          native/build-release/cypha_bench_run --list-domains
          native/build-release/cypha_bench_report --help
          native/build-release/cypha_diagnostics_run --list
          native/build-release/cypha_tune_run --help
          test -x native/build-release/qt/cypha_qt_shell || test -x native/build-release/cypha_qt_shell

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          bash scripts/package_release_linux.sh "$VERSION" native/build-release dist

      - name: Install linuxdeploy (AppImage)
        run: |
          wget -q -O /tmp/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O /tmp/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage /tmp/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage (cypha_qt_shell + cypha_rest)
        env:
          SKIP_BUILD: "1"
          LINUXDEPLOY: /tmp/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_QT: /tmp/linuxdeploy-plugin-qt-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          test -x native/build-release/cypha_qt_shell || test -x native/build-release/qt/cypha_qt_shell
          test -x native/build-release/cypha_rest || test -x native/build-release/qt/cypha_rest
          bash packaging/build_appimage.sh "$VERSION" native/build-release dist

      - name: Verify release bundle contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar xzf "dist/cypha-${VERSION}-linux-x86_64.tar.gz" -C dist
          STAGE="dist/cypha-${VERSION}-linux-x86_64"
          for bin in cypha_rest cypha_bench_run cypha_bench_report cypha_diagnostics_run cypha_tune_run \
                     cyphalm_bench_native cyphalm_parity cyphalm_checkpoint_parity \
                     gh_infer_deliberation_parity kernel_llr_parity registry_register create_model_smoke; do
            test -x "$STAGE/bin/$bin"
          done
          for bin in score_batch_parity multilabel_dif_parity merge_from_parity similarity_index_parity \
                     embed_table_parity retrieval_parity som_parity; do
            test -x "$STAGE/bin/dev/$bin"
          done
          APPIMAGE="dist/cypha-${VERSION}-linux-x86_64.AppImage"
          test -x "$APPIMAGE"
          file "$APPIMAGE" | grep -qi 'AppImage\|ELF'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/cypha-*-linux-x86_64.tar.gz
            dist/cypha-*-linux-x86_64.AppImage

  build-windows:
    name: Windows x86_64 package (MinGW cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW + CMake
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-mingw-w64-x86-64 zip

      - name: Configure + build (Windows PE)
        run: |
          cmake -S native -B native/build-mingw-release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/native/toolchains/mingw-w64-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -G Ninja
          cmake --build native/build-mingw-release --parallel --target all

      - name: List Windows PE binaries (pre-package)
        run: ls -la native/build-mingw-release/*.exe | sort

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package_release_windows.sh "$VERSION" native/build-mingw-release dist

      - name: Verify release bundle contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/cypha-${VERSION}-windows-x86_64.zip"
          STAGE="dist/cypha-${VERSION}-windows-x86_64"
          rm -rf "$STAGE"
          unzip -q "$ARCHIVE" -d dist
          missing=0
          for bin in cypha_rest.exe cypha_bench_run.exe cypha_bench_report.exe cypha_diagnostics_run.exe cypha_tune_run.exe \
                     cyphalm_bench_native.exe cyphalm_parity.exe cyphalm_checkpoint_parity.exe \
                     gh_infer_deliberation_parity.exe kernel_llr_parity.exe registry_register.exe create_model_smoke.exe; do
            if ! test -f "$STAGE/bin/$bin"; then
              echo "MISSING $STAGE/bin/$bin"
              missing=1
            fi
          done
          for bin in score_batch_parity.exe multilabel_dif_parity.exe merge_from_parity.exe similarity_index_parity.exe \
                     embed_table_parity.exe retrieval_parity.exe som_parity.exe; do
            if ! test -f "$STAGE/bin/dev/$bin"; then
              echo "MISSING $STAGE/bin/dev/$bin"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/cypha-*-windows-x86_64.zip

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Maintainer release notes stub (optional)
        continue-on-error: true
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -File scripts/create_release_notes.ps1 -Tag "${{ github.ref_name }}" \
              > dist/maintainer_release_notes.md
            head -40 dist/maintainer_release_notes.md || true
          else
            echo "Install PowerShell (pwsh) locally to run scripts/create_release_notes.ps1"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cypha-*-linux-x86_64.tar.gz
            dist/cypha-*-linux-x86_64.AppImage
            dist/cypha-*-windows-x86_64.zip
          body: |
            ## Cypha ${{ github.ref_name }} — native C++ framework

            Prebuilt **native C++** runtime only (no Python venv): CyphaDIF REST (`/dif/retrieve`, `/dif/generate`), native bench (d01–d17), CyphaLM, diagnostics orchestrator, parity smoke tools, and a **standalone Qt shell AppImage** on Linux.

            ### Linux CLI (`cypha-*-linux-x86_64.tar.gz`)

            ```bash
            tar xzf cypha-*-linux-x86_64.tar.gz
            cd cypha-*-linux-x86_64
            bash install.sh
            ```

            Requires: `libgomp1`, glibc 2.31+.

            ### Linux Qt AppImage (`cypha-*-linux-x86_64.AppImage`)

            Self-contained **`cypha_qt_shell`** with Qt libraries bundled via linuxdeploy. **`cypha_rest`** is included as a sidecar.

            ```bash
            chmod +x cypha-*-linux-x86_64.AppImage
            ./cypha-*-linux-x86_64.AppImage
            ```

            Build locally: `bash packaging/build_appimage.sh <version>` (see [`packaging/README.md`](packaging/README.md)).

            ### Windows CLI (`cypha-*-windows-x86_64.zip`)

            ```powershell
            Expand-Archive cypha-*-windows-x86_64.zip
            cd cypha-*-windows-x86_64
            powershell -ExecutionPolicy Bypass -File install.ps1
            ```

            MinGW PE binaries with static libgcc/libstdc++ (no separate MinGW runtime install).

            **Windows Qt GUI:** build natively on Windows with `packaging/build_windows_bundle.ps1` (`windeployqt`; see [`packaging/README.md`](packaging/README.md)).

            ### Production binaries (`bin/`, on PATH after install)

            | Binary | Role |
            |--------|------|
            | `cypha_rest` | Native REST server (classifier + `/lm/*`, `/generate`, `/dif/*`) |
            | `cypha_bench_run` | Bench master runner (domains d01–d17) |
            | `cypha_bench_report` | Report-only rebuild (`BASELINE_REPORT.md` + `summary.json`) |
            | `cypha_diagnostics_run` | Phases 1–4 diagnostics orchestrator |
            | `cypha_tune_run` | Native tuning sweep runner |
            | `cyphalm_bench_native` | WikiText BPC bench CLI |
            | `cyphalm_parity`, `cyphalm_checkpoint_parity` | CyphaLM parity smoke tools |
            | `gh_infer_deliberation_parity`, `kernel_llr_parity` | CyphaDIF parity (used by diagnostics) |
            | `registry_register`, `create_model_smoke` | Registry + model creation smoke |

            ### Dev parity tools (`bin/dev/`, not on PATH)

            - `score_batch_parity`, `multilabel_dif_parity`, `merge_from_parity`, `similarity_index_parity`
            - `embed_table_parity`, `retrieval_parity`, `som_parity`

            ### Phase 7 maintainer notes

            - **Baseline lock:** [`bench/BASELINE_LOCK.json`](bench/BASELINE_LOCK.json) — D17 hybrid **2.873 BPC** @ 300k (Phase 1c reference).
            - **Local publish:** `pwsh -File scripts/publish_release.ps1 -Tag ${{ github.ref_name }}` (requires `gh auth login`; CI publish uses this workflow).
            - **Overnight bench:** `pwsh -File scripts/run_d17_overnight.ps1` — update `overnight_results` in `BASELINE_LOCK.json` after a real 300k run.
            - **CI gate:** **90 CTests** (`ctest -R native_`).
