# Build Linux + Windows (native MSVC) release archives and publish a GitHub Release on tag push.
# Native-only assets — no Python venv. Linux also ships a Qt AppImage (cypha_qt_shell + cypha_rest).
#
# Create a release:
#   git tag v2.0.0
#   git push origin v2.0.0
#
# Artifacts:
#   cypha-<version>-linux-x86_64.tar.gz
#   cypha-<version>-linux-x86_64.AppImage
#   cypha-<version>-windows-x86_64.zip
#
# Phase 7 (v2.3.7+): maintainer may also attach bench/BASELINE_LOCK.json snapshot
# or overnight result JSON via scripts/publish_release.ps1 after local gh auth.
# Phase 8 (v2.3.8+): update BASELINE_LOCK via scripts/update_baseline_lock.ps1
# (cypha_baseline_lock CLI); d22 cross-profile bench smoke in CI via native_d22_cross_smoke.
# Phase 9 (v2.3.9, shipped): scripts/run_overnight_all.ps1 unified overnight runner;
# d23 overnight lock validation (native_d23_overnight_lock_smoke);
# hybrid EWC weight Fisher + checkpoint persistence (native_ewc_weights_smoke); 98 CTests.
# Phase 10 (v2.3.10, shipped): EWC bias/W_slow Fisher; d24 production lock;
# cypha_baseline_lock --run all; scripts/ci_federated_tls_windows.ps1; 99 CTests.
# Phase 11 (v2.3.11, shipped): WikiText download scripts; gutenberg fallback for d17/d21;
# corpus_smoke + d25 corpus readiness; overnight -Fast fix; 101 CTests.
# Phase 12 (v2.3.12, shipped everywhere): medium overnight -Medium tier; d26 lock validation;
# validate_baseline_lock.ps1 + baseline_lock_validate; publish_release -DryRun;
# optional corpus_and_d25 CI job; 103 CTests.
# Phase 13 (v2.3.13, shipped): production overnight -Production tier (300k/2000);
# run_production_overnight.ps1; d27 production lock validation;
# validate_baseline_lock.ps1 -Production; 104 CTests (production tier not run in CI).
# Phase 14 (v2.3.14, shipped): status validator fix (medium_smoke/production);
# d28 overnight completion; finalize_production_overnight.ps1; 106 CTests.
# Phase 15 (v2.3.15, shipped): d29 release readiness gate; commit_production_lock.ps1;
# watch_production_overnight.ps1; CYPHA_VALIDATE_* env vars; 107 CTests.
# Phase 16 (v2.3.16, shipped): d30 artifact path hygiene; migrate_legacy_results.ps1;
# overnight progress logging; CYPHA_VALIDATE_ARTIFACT_HYGIENE; 108 CTests.
# Phase 17 (v2.3.17, shipped): d31 post-overnight pipeline; poll_and_finalize_overnight.ps1;
# cleanup_legacy_results.ps1; CYPHA_VALIDATE_POST_OVERNIGHT_PIPELINE; 109 CTests.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-linux:
    name: Linux x86_64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + Qt + AppImage deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build g++ libsqlite3-dev \
            qt6-base-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1-mesa-dri libglib2.0-0 \
            wget file patchelf libfuse2 fuse

      - name: Configure + build (Release, Qt shell)
        run: |
          cmake -S native -B native/build-release \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCYPHA_BUILD_QT=ON \
            -G Ninja
          cmake --build native/build-release --parallel

      - name: Smoke CTest (native suite + bench runner)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir native/build-release -R native_cyphalm_parity_suite --output-on-failure
          ctest --test-dir native/build-release -R native_bench_run_list_domains --output-on-failure

      - name: Smoke CLI (release binaries)
        run: |
          native/build-release/cypha_bench_run --list-domains
          native/build-release/cypha_bench_report --help
          native/build-release/cypha_diagnostics_run --list
          native/build-release/cypha_tune_run --help
          test -x native/build-release/qt/cypha_qt_shell || test -x native/build-release/cypha_qt_shell

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          bash scripts/package_release_linux.sh "$VERSION" native/build-release dist

      - name: Install linuxdeploy (AppImage)
        run: |
          wget -q -O /tmp/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O /tmp/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage /tmp/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage (cypha_qt_shell + cypha_rest)
        id: appimage
        continue-on-error: true
        env:
          SKIP_BUILD: "1"
          LINUXDEPLOY: /tmp/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_QT: /tmp/linuxdeploy-plugin-qt-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          test -x native/build-release/cypha_qt_shell || test -x native/build-release/qt/cypha_qt_shell
          test -x native/build-release/cypha_rest || test -x native/build-release/qt/cypha_rest
          test -f packaging/cypha.png
          bash packaging/build_appimage.sh "$VERSION" native/build-release dist

      - name: Verify release bundle contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar xzf "dist/cypha-${VERSION}-linux-x86_64.tar.gz" -C dist
          STAGE="dist/cypha-${VERSION}-linux-x86_64"
          for bin in cypha_rest cypha_bench_run cypha_bench_report cypha_diagnostics_run cypha_tune_run \
                     cyphalm_bench_native cypha_baseline_lock baseline_lock_validate \
                     registry_register create_model_smoke; do
            test -x "$STAGE/bin/$bin"
          done
          for bin in score_batch_golden multilabel_dif_golden merge_from_golden similarity_index_golden \
                     embed_table_golden retrieval_golden som_golden kernel_llr_golden \
                     gh_infer_deliberation_golden cyphalm_checkpoint_golden; do
            test -x "$STAGE/bin/dev/$bin"
          done
          APPIMAGE="dist/cypha-${VERSION}-linux-x86_64.AppImage"
          if [[ -f "$APPIMAGE" ]]; then
            test -x "$APPIMAGE"
            file "$APPIMAGE" | grep -qi 'AppImage\|ELF'
          else
            echo "WARN: AppImage not produced; shipping Linux CLI tarball only"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            dist/cypha-*-linux-x86_64.tar.gz
            dist/cypha-*-linux-x86_64.AppImage

  build-windows:
    name: Windows x86_64 package (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC + Ninja
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure + build (MSVC Release)
        shell: cmd
        run: |
          cmake -S native -B native/build-msvc-release -G Ninja -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE%
          cmake --build native/build-msvc-release --parallel

      - name: List Windows MSVC binaries (pre-package)
        shell: powershell
        run: Get-ChildItem native\build-msvc-release -Filter *.exe | Sort-Object Name | Format-Table Name,Length

      - name: Package zip
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          & .\scripts\package_release_windows.ps1 -Version $Version -BuildDir native\build-msvc-release -OutDir dist

      - name: Verify release bundle contents
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          $Archive = "dist\cypha-$Version-windows-x86_64.zip"
          $Stage = "dist\cypha-$Version-windows-x86_64"
          if (Test-Path $Stage) { Remove-Item $Stage -Recurse -Force }
          Expand-Archive -Path $Archive -DestinationPath dist -Force
          $need = @(
            'cypha_rest.exe','cypha_bench_run.exe','cypha_bench_report.exe','cypha_diagnostics_run.exe',
            'cypha_tune_run.exe','cyphalm_bench_native.exe','cypha_baseline_lock.exe',
            'baseline_lock_validate.exe','registry_register.exe','create_model_smoke.exe'
          )
          $dev = @(
            'score_batch_golden.exe','multilabel_dif_golden.exe','merge_from_golden.exe',
            'similarity_index_golden.exe','embed_table_golden.exe','retrieval_golden.exe',
            'som_golden.exe','kernel_llr_golden.exe','gh_infer_deliberation_golden.exe',
            'cyphalm_checkpoint_golden.exe'
          )
          foreach ($b in $need) {
            if (-not (Test-Path "$Stage\bin\$b")) { throw "MISSING $Stage\bin\$b" }
          }
          foreach ($b in $dev) {
            if (-not (Test-Path "$Stage\bin\dev\$b")) { throw "MISSING $Stage\bin\dev\$b" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/cypha-*-windows-x86_64.zip

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Maintainer release notes stub (optional)
        continue-on-error: true
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -File scripts/create_release_notes.ps1 -Tag "${{ github.ref_name }}" \
              > dist/maintainer_release_notes.md
            head -40 dist/maintainer_release_notes.md || true
          else
            echo "Install PowerShell (pwsh) locally to run scripts/create_release_notes.ps1"
          fi

      # softprops cannot PATCH a release created outside Actions ("Resource not accessible
      # by integration"). Delete any prior release for this tag, then create fresh.
      - name: Delete prior GitHub Release for tag (keep tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" -y || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cypha-*-linux-x86_64.tar.gz
            dist/cypha-*-linux-x86_64.AppImage
            dist/cypha-*-windows-x86_64.zip
          body: |
            ## Cypha ${{ github.ref_name }} — native C++ framework

            Prebuilt **native C++** runtime only (no Python venv): Cypha REST (`/sample`, `/retrieve`, `/sequence/*`), native bench (d01–d17), Cypha sequence, diagnostics orchestrator, parity smoke tools, and a **standalone Qt shell AppImage** on Linux.

            ### Linux CLI (`cypha-*-linux-x86_64.tar.gz`)

            ```bash
            tar xzf cypha-*-linux-x86_64.tar.gz
            cd cypha-*-linux-x86_64
            bash install.sh
            ```

            Requires: `libgomp1`, glibc 2.31+.

            ### Linux Qt AppImage (`cypha-*-linux-x86_64.AppImage`)

            Self-contained **`cypha_qt_shell`** with Qt libraries bundled via linuxdeploy. **`cypha_rest`** is included as a sidecar.

            ```bash
            chmod +x cypha-*-linux-x86_64.AppImage
            ./cypha-*-linux-x86_64.AppImage
            ```

            Build locally: `bash packaging/build_appimage.sh <version>` (see [`packaging/README.md`](packaging/README.md)).

            ### Windows CLI (`cypha-*-windows-x86_64.zip`)

            ```powershell
            Expand-Archive cypha-*-windows-x86_64.zip
            cd cypha-*-windows-x86_64
            powershell -ExecutionPolicy Bypass -File install.ps1
            ```

            Native **MSVC** x64 binaries (Visual Studio / VC++ redistributable on clean machines).

            **Windows Qt GUI:** build natively on Windows with `packaging/build_windows_bundle.ps1` (`windeployqt`; see [`packaging/README.md`](packaging/README.md)).

            ### Production binaries (`bin/`, on PATH after install)

            | Binary | Role |
            |--------|------|
            | `cypha_rest` | Native REST server (classifier + `/sample`, `/retrieve`, `/sequence/*`) |
            | `cypha_bench_run` | Bench master runner (domains d01–d17) |
            | `cypha_bench_report` | Report-only rebuild (`BASELINE_REPORT.md` + `summary.json`) |
            | `cypha_diagnostics_run` | Phases 1–4 diagnostics orchestrator |
            | `cypha_tune_run` | Native tuning sweep runner |
            | `cyphalm_bench_native` | WikiText BPC bench CLI |
            | `cypha_baseline_lock`, `baseline_lock_validate` | Baseline lock update / validate |
            | `registry_register`, `create_model_smoke` | Registry + model creation smoke |

            ### Dev golden tools (`bin/dev/`, not on PATH)

            - `score_batch_golden`, `multilabel_dif_golden`, `merge_from_golden`, `similarity_index_golden`
            - `embed_table_golden`, `retrieval_golden`, `som_golden`, `kernel_llr_golden`
            - `gh_infer_deliberation_golden`, `cyphalm_checkpoint_golden`

            ### Phase 7 maintainer notes

            - **Baseline lock:** [`bench/BASELINE_LOCK.json`](bench/BASELINE_LOCK.json) — D17 hybrid **2.873 BPC** @ 300k (Phase 1c reference).
            - **Local publish:** `pwsh -File scripts/publish_release.ps1 -Tag ${{ github.ref_name }}` (requires `gh auth login`; CI publish uses this workflow).
            - **Overnight bench:** `pwsh -File scripts/run_d17_overnight.ps1` — update `overnight_results` in `BASELINE_LOCK.json` after a real 300k run.

            ### Phase 8 maintainer notes

            - **Baseline lock update:** `pwsh -File scripts/update_baseline_lock.ps1 -Run d17` (or `-Run d21`, `-Run cell-sweep`; add `-Fast` for smoke) — wraps **`cypha_baseline_lock`** CLI.
            - **Cross-profile bench:** `cypha_bench_run --domain-tag d22` — d18 intelligence + d16 EWC probe + d20 cell sweep; profile [`bench/config/d22_intelligence_cross_profile.json`](bench/config/d22_intelligence_cross_profile.json).
            - **Hybrid EWC:** SSM/GRIA α Fisher overlay + B0 **`ngram_count_table`** prior; H01 α forget gate; Cypha sequence checkpoint persists ngram counts.
            - **CI gate:** **96 CTests** (`ctest -R native_`); optional **`federated_tls`** job runs **`native_federated_tls_smoke`** with **`-DCYPHA_ENABLE_OPENSSL=ON`** (`bash scripts/ci_federated_tls_linux.sh` locally).

            ### Phase 9 maintainer notes (v2.3.9, shipped)

            - **Unified overnight:** `pwsh -File scripts/run_overnight_all.ps1` — D17 + d21 RPSM + 28-variant cell sweep + `update_baseline_lock.ps1` refresh of [`bench/BASELINE_LOCK.json`](bench/BASELINE_LOCK.json). Add `-Fast` for smoke token budgets.
            - **Overnight lock validation:** `cypha_bench_run --domain-tag d23` — FAST wiring check for baseline-lock schema and mini overnight path; profile [`bench/config/d23_overnight_lock_profile.json`](bench/config/d23_overnight_lock_profile.json).
            - **Hybrid EWC weight Fisher:** diagonal Fisher on GRIA **U**/**V** + SSM **W_fast** (extends Phase 8 α Fisher); EWC anchor/Fisher blocks persisted in Cypha `checkpoint.json`.
            - **CI gate:** **98 CTests** (`ctest -R native_`); smokes **`native_d23_overnight_lock_smoke`**, **`native_ewc_weights_smoke`**.

            ### Phase 10 maintainer notes (v2.3.10, shipped)

            - **Hybrid EWC bias + W_slow Fisher:** diagonal Fisher on GRIA **`bias`** + SSM **`W_slow`** (extends Phase 9 weight Fisher); CTest **`native_ewc_weights_smoke`**.
            - **Baseline lock all runs:** `cypha_baseline_lock --run all --fast --lock-file bench/BASELINE_LOCK.json` — or `pwsh -File scripts/update_baseline_lock.ps1 -Run all -Fast`.
            - **Production lock validation:** `cypha_bench_run --domain-tag d24` — end-to-end `BASELINE_LOCK.json` check under production profiles; profile [`bench/config/d24_production_lock_profile.json`](bench/config/d24_production_lock_profile.json).
            - **Federated TLS Windows mirror:** `pwsh -File scripts/ci_federated_tls_windows.ps1` — local Windows mirror of optional **`federated_tls`** CI job (`-DCYPHA_ENABLE_OPENSSL=ON`, `native_federated_tls_smoke`; skip without OpenSSL).
            - **CI gate:** **99 CTests** (`ctest -R native_`); smokes **`native_d24_production_lock_smoke`**, **`native_ewc_weights_smoke`**.

            ### Phase 11 maintainer notes (v2.3.11, shipped)

            - **WikiText-2 download:** `pwsh -File scripts/download_wikitext2.ps1` or `bash scripts/download_wikitext2.sh` — extracts to [`bench/data/wikitext2/wikitext-2/`](bench/data/wikitext2/README.md) (`wiki.{train,valid,test}.tokens`).
            - **Gutenberg fallback:** when WikiText is absent, d17/d21 bench uses `bench/data/gutenberg/*.txt` with source tag **`gutenberg_fallback`** (Moby Dick preferred).
            - **Corpus readiness:** `corpus_smoke` (direct d17/d21 load probe); `cypha_bench_run --domain-tag d25` — profile [`bench/config/d25_corpus_readiness_profile.json`](bench/config/d25_corpus_readiness_profile.json); report [`bench/report/tables/d25_corpus_readiness.json`](bench/report/tables/d25_corpus_readiness.json).
            - **Overnight without WikiText:** add `-Fast` to `run_d17_overnight.ps1`, `run_rpsm_overnight.ps1`, or `run_overnight_all.ps1` — sets **`CYPHA_BENCH_FAST=1`** for synthetic corpus fallback.
            - **CI gate:** **101 CTests** (`ctest -R native_`); new smokes **`native_d25_corpus_smoke`**, **`native_corpus_smoke`**.

            ### Phase 12 maintainer notes (v2.3.12, shipped everywhere)

            - **Medium overnight tier:** add `-Medium` to `run_d17_overnight.ps1`, `run_rpsm_overnight.ps1`, or `run_overnight_all.ps1` — 5k train / 256 eval with real WikiText or gutenberg (no `CYPHA_BENCH_FAST`). `cypha_baseline_lock --medium` writes `status=medium_smoke`.
            - **Medium lock validation:** `cypha_bench_run --domain-tag d26` — profile [`bench/config/d26_medium_overnight_profile.json`](bench/config/d26_medium_overnight_profile.json); report [`bench/report/tables/d26_medium_overnight_validation.json`](bench/report/tables/d26_medium_overnight_validation.json).
            - **Baseline lock validator:** `pwsh -File scripts/validate_baseline_lock.ps1` (add `-Strict` to reject `fast_smoke`-only overnight); C++ CLI `baseline_lock_validate --lock-file bench/BASELINE_LOCK.json`.
            - **Release preview:** `pwsh -File scripts/publish_release.ps1 -Tag v2.3.12 -DryRun` (or `-NotesOnly`) — notes to stdout without `gh`.
            - **Optional CI:** `corpus_and_d25` job — WikiText fetch + `native_corpus_smoke` / `native_d25_corpus_smoke` (`continue-on-error`).
            - **CI gate:** **103 CTests** at Phase 12 (`ctest -R native_`); new smokes **`native_d26_medium_overnight_smoke`**, **`native_baseline_lock_validate_smoke`**.

            ### Phase 13 maintainer notes (v2.3.13, shipped)

            - **Production overnight tier:** add `-Production` to `run_d17_overnight.ps1`, `run_rpsm_overnight.ps1`, or `run_overnight_all.ps1` — 300k train / 2000 eval with real WikiText or gutenberg (mutually exclusive with `-Fast`/`-Medium`). `cypha_baseline_lock --production` writes `status=production` and sets `CYPHA_BENCH_FULL_CORPUS=1`, `CYPHA_BENCH_OVERNIGHT=1`, `CYPHA_BENCH_FULL_N_TRAIN=300000`.
            - **Dedicated production runner:** `pwsh -File scripts/run_production_overnight.ps1` — chains `run_overnight_all.ps1 -Production`, logs to `bench/results/production_overnight_<timestamp>.log`. Maintainer-only; not run in CI.
            - **Production lock validation:** `cypha_bench_run --domain-tag d27` — profile [`bench/config/d27_production_lock_profile.json`](bench/config/d27_production_lock_profile.json); report [`bench/report/tables/d27_production_lock_validation.json`](bench/report/tables/d27_production_lock_validation.json). Smoke passes with `pending_production` when lock has no 300k run yet.
            - **Production validator:** `pwsh -File scripts/validate_baseline_lock.ps1 -Production` — when `overnight_results.n_train >= 300000`, require `status=production` or `completed` and BPC within 0.05 of d17 hybrid **2.873** pin; C++ CLI `baseline_lock_validate --production`.
            - **CI gate:** **104 CTests** (`ctest -R native_`); new smoke **`native_d27_production_lock_smoke`**. Full 300k production overnight remains maintainer workflow.

            ### Phase 14 maintainer notes (v2.3.14, shipped)

            - **Status validator fix:** `pwsh -File scripts/validate_baseline_lock.ps1` and **`baseline_lock_validate`** accept **`medium_smoke`** and **`production`** (fixes lock validation after medium/production overnight runs).
            - **Cell sweep artifact path:** default overnight output **`bench/results/cell_sweep`** via **`bench_paths::results_dir()`**; wired through **`cypha_baseline_lock --output-dir`**, **`update_baseline_lock.ps1`**, and **`run_overnight_all.ps1`**.
            - **Unified overnight completion:** `cypha_bench_run --domain-tag d28` — cross-check **`overnight_results`**, **`rpsm_results`**, and **`cell_sweep_results`** for matching **`n_train`** / **`n_eval`**; profile [`bench/config/d28_overnight_complete_profile.json`](bench/config/d28_overnight_complete_profile.json).
            - **Post-overnight finalize:** `pwsh -File scripts/finalize_production_overnight.ps1` — **`validate_baseline_lock.ps1 -Production`**, d27 + d28 bench domains, lock section summary; chained from **`run_production_overnight.ps1`** on success.
            - **Optional local gate:** set **`CYPHA_VALIDATE_OVERNIGHT_COMPLETE=1`** on **`cypha_native_validate_all.ps1`** to run d28 after baseline lock validate.
            - **CI gate:** **106 CTests** (`ctest -R native_`); new smokes **`native_d28_overnight_complete_smoke`**, **`native_baseline_lock_validate_production_status`**. Full 300k production overnight remains maintainer workflow.

            ### Phase 15 maintainer notes (v2.3.15, shipped)

            - **Release readiness validation:** `cypha_bench_run --domain-tag d29` — schema + production tier (d27) + overnight-complete (d28) + release script presence; profile [`bench/config/d29_release_readiness_profile.json`](bench/config/d29_release_readiness_profile.json); report [`bench/report/tables/d29_release_readiness_validation.json`](bench/report/tables/d29_release_readiness_validation.json). **`pending_release`** when gates pending (smoke pass); **`release_ready`** when both production and overnight-complete validated @ 300k.
            - **Lock commit helper:** `pwsh -File scripts/commit_production_lock.ps1` — chains **`finalize_production_overnight.ps1`**, then stage/commit **`bench/BASELINE_LOCK.json`** when **`overnight_results.n_train >= 300000`** (`-DryRun` preview; **`-Force`** to commit; never pushes).
            - **Production overnight watcher:** `pwsh -File scripts/watch_production_overnight.ps1` — log growth, process PIDs, lock section summary; `-Once` snapshot; stall warn after 30m without log growth.
            - **Local validate env vars:** set **`CYPHA_VALIDATE_OVERNIGHT_COMPLETE=1`**, **`CYPHA_VALIDATE_RELEASE_READINESS=1`**, **`CYPHA_VALIDATE_PRODUCTION=1`**, or **`CYPHA_STRICT_TEST_COUNT=1`** on **`cypha_native_validate_all.ps1`** for optional d28/d29/production gates and strict **107** CTest count check.
            - **CI gate:** **107 CTests** (`ctest -R native_`); new smoke **`native_d29_release_readiness_smoke`**. Full 300k production overnight **in progress** — not run in CI; **`gh auth login`** required for local **`publish_release.ps1`** publish.

            ### Phase 16 maintainer notes (v2.3.16, shipped)

            - **Artifact path hygiene validation:** `cypha_bench_run --domain-tag d30` — legacy repo-root **`results/`** path detection in **`cell_sweep_results.artifact_path`**, verifies **`bench/results/.gitkeep`**; profile [`bench/config/d30_artifact_hygiene_profile.json`](bench/config/d30_artifact_hygiene_profile.json); report [`bench/report/tables/d30_artifact_hygiene_validation.json`](bench/report/tables/d30_artifact_hygiene_validation.json).
            - **Legacy results migration:** `pwsh -File scripts/migrate_legacy_results.ps1 -DryRun` (preview) or `-RemoveLegacy` (copy then delete repo-root **`results/`** when destination has all files).
            - **Overnight progress logging:** **`run_d17_overnight.ps1`** tees to **`bench/results/overnight_d17_<timestamp>.log`**; stderr **`[cyphalm]`** / **`[cell_sweep]`** tags during full overnight runs.
            - **Local validate env var:** set **`CYPHA_VALIDATE_ARTIFACT_HYGIENE=1`** on **`cypha_native_validate_all.ps1`** to run d30 after rebuild.
