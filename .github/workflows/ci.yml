# Native CTest (headless Qt compile-check when CYPHA_BUILD_QT=ON).
#
# Two blocking jobs: Linux native build+test, MinGW Windows PE cross-compile.
# Optional third job: federated TLS smoke (OpenSSL; continue-on-error — does not gate merges).
# Optional fourth job: corpus_and_d25 (WikiText fetch + corpus smokes; continue-on-error).
# CI gate: 103 CTests (`ctest -R native_`, Qt GUI exec excluded on headless Linux).
# CUDA is optional for local builds only (see docs/native/ACCEL_CUDA.md).
#
# Parity fixtures live under fixtures/ (regenerate offline if core math changes).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev libz-dev qt6-base-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1-mesa-dri libglib2.0-0
      - name: Native build + CTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCYPHA_BUILD_QT=ON
          cmake --build native/build -j 2
          # Qt Widgets smoke needs a full desktop stack; compile-check Qt here, run parity CTests without GUI exec.
          ctest --test-dir native/build --output-on-failure -R native_ -E 'native_qt_shell_smoke|native_qt_stub_load_reference'
        # Local equivalent: bash scripts/ci_native_linux.sh

  mingw_cross:
    name: Build (Windows MinGW PE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MinGW + CMake
        run: sudo apt-get update && sudo apt-get install -y cmake g++-mingw-w64-x86_64
      - name: Configure + build (Windows PE)
        run: |
          cmake -S native -B native/build-mingw-w64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/native/toolchains/mingw-w64-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-mingw-w64 --parallel --target all
      - name: Verify MinGW cross build (PE artifacts)
        run: |
          ls -la native/build-mingw-w64/*.exe | sort
          for bin in cypha_rest.exe cypha_bench_run.exe cypha_bench_report.exe cypha_diagnostics_run.exe cypha_tune_run.exe; do
            test -f "native/build-mingw-w64/$bin"
          done

  federated_tls:
    name: Federated TLS smoke (OpenSSL, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install OpenSSL toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev openssl
      - name: Federated TLS CTest (OpenSSL)
        run: bash scripts/ci_federated_tls_linux.sh
        # Local equivalent: bash scripts/ci_federated_tls_linux.sh

  corpus_and_d25:
    name: Corpus + d25 smoke (WikiText, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev libz-dev unzip
      - name: Download WikiText-2 (best effort)
        run: bash scripts/download_wikitext2.sh || true
      - name: Native build + corpus CTests
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build -j 2
          ctest --test-dir native/build --output-on-failure -R "native_corpus_smoke|native_d25_corpus_smoke"
        # Local equivalent: bash scripts/download_wikitext2.sh; ctest -R "native_corpus_smoke|native_d25_corpus_smoke"
