# Build Linux + Windows (MSVC) + macOS release archives and publish a GitHub Release on tag push.
# Native-only assets — no Python venv. Linux also ships a Qt AppImage (cypha_qt_shell + cypha_rest).
#
# Create a release:
#   git tag v2.5.0
#   git push origin v2.5.0
#
# Artifacts:
#   cypha-<version>-linux-x86_64.tar.gz
#   cypha-<version>-linux-x86_64.AppImage
#   cypha-<version>-windows-x86_64.zip
#   cypha-<version>-macos-arm64.tar.gz   (macos-latest / Apple Silicon)
#   cypha-<version>-arxiv-bundle.zip
#
# Phase 7 (v2.3.7+): maintainer may also attach bench/BASELINE_LOCK.json snapshot
# or overnight result JSON via scripts/publish_release.ps1 after local gh auth.
# Phase 8 (v2.3.8+): update BASELINE_LOCK via scripts/update_baseline_lock.ps1
# (cypha_baseline_lock CLI); d22 cross-profile bench smoke in CI via native_d22_cross_smoke.
# Phase 9 (v2.3.9, shipped): scripts/run_overnight_all.ps1 unified overnight runner;
# d23 overnight lock validation (native_d23_overnight_lock_smoke);
# hybrid EWC weight Fisher + checkpoint persistence (native_ewc_weights_smoke); 98 CTests.
# Phase 10 (v2.3.10, shipped): EWC bias/W_slow Fisher; d24 production lock;
# cypha_baseline_lock --run all; scripts/ci_federated_tls_windows.ps1; 99 CTests.
# Phase 11 (v2.3.11, shipped): WikiText download scripts; gutenberg fallback for d17/d21;
# corpus_smoke + d25 corpus readiness; overnight -Fast fix; 101 CTests.
# Phase 12 (v2.3.12, shipped everywhere): medium overnight -Medium tier; d26 lock validation;
# validate_baseline_lock.ps1 + baseline_lock_validate; publish_release -DryRun;
# optional corpus_and_d25 CI job; 103 CTests.
# Phase 13 (v2.3.13, shipped): production overnight -Production tier (300k/2000);
# run_production_overnight.ps1; d27 production lock validation;
# validate_baseline_lock.ps1 -Production; 104 CTests (production tier not run in CI).
# Phase 14 (v2.3.14, shipped): status validator fix (medium_smoke/production);
# d28 overnight completion; finalize_production_overnight.ps1; 106 CTests.
# Phase 15 (v2.3.15, shipped): d29 release readiness gate; commit_production_lock.ps1;
# watch_production_overnight.ps1; CYPHA_VALIDATE_* env vars; 107 CTests.
# Phase 16 (v2.3.16, shipped): d30 artifact path hygiene; migrate_legacy_results.ps1;
# overnight progress logging; CYPHA_VALIDATE_ARTIFACT_HYGIENE; 108 CTests.
# Phase 17 (v2.3.17, shipped): d31 post-overnight pipeline; poll_and_finalize_overnight.ps1;
# cleanup_legacy_results.ps1; CYPHA_VALIDATE_POST_OVERNIGHT_PIPELINE; 109 CTests.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-linux:
    name: Linux x86_64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain + Qt + AppImage deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build g++ libsqlite3-dev \
            qt6-base-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1-mesa-dri libglib2.0-0 \
            wget file patchelf libfuse2 fuse

      - name: Configure + build (Release, Qt shell)
        run: |
          cmake -S native -B native/build-release \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCYPHA_BUILD_QT=ON \
            -G Ninja
          cmake --build native/build-release --parallel

      - name: Smoke CTest (native suite + bench runner)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir native/build-release -R native_cyphalm_parity_suite --output-on-failure
          ctest --test-dir native/build-release -R native_bench_run_list_domains --output-on-failure

      - name: Smoke CLI (release binaries)
        run: |
          native/build-release/cypha_bench_run --list-domains
          native/build-release/cypha_bench_report --help
          native/build-release/cypha_diagnostics_run --list
          native/build-release/cypha_tune_run --help
          test -x native/build-release/qt/cypha_qt_shell || test -x native/build-release/cypha_qt_shell

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          bash scripts/package_release_linux.sh "$VERSION" native/build-release dist

      - name: Install linuxdeploy (AppImage)
        run: |
          wget -q -O /tmp/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O /tmp/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage /tmp/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage (cypha_qt_shell + cypha_rest)
        id: appimage
        continue-on-error: true
        env:
          SKIP_BUILD: "1"
          LINUXDEPLOY: /tmp/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_QT: /tmp/linuxdeploy-plugin-qt-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          test -x native/build-release/cypha_qt_shell || test -x native/build-release/qt/cypha_qt_shell
          test -x native/build-release/cypha_rest || test -x native/build-release/qt/cypha_rest
          test -f packaging/cypha.png
          bash packaging/build_appimage.sh "$VERSION" native/build-release dist

      - name: Verify release bundle contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar xzf "dist/cypha-${VERSION}-linux-x86_64.tar.gz" -C dist
          STAGE="dist/cypha-${VERSION}-linux-x86_64"
          for bin in cypha_rest cypha_bench_run cypha_bench_report cypha_diagnostics_run cypha_tune_run \
                     cyphalm_bench_native cypha_baseline_lock baseline_lock_validate \
                     registry_register create_model_smoke; do
            test -x "$STAGE/bin/$bin"
          done
          for bin in score_batch_golden multilabel_dif_golden merge_from_golden similarity_index_golden \
                     retrieval_golden som_golden kernel_llr_golden \
                     gh_infer_deliberation_golden cyphalm_checkpoint_golden; do
            test -x "$STAGE/bin/dev/$bin"
          done
          APPIMAGE="dist/cypha-${VERSION}-linux-x86_64.AppImage"
          if [[ -f "$APPIMAGE" ]]; then
            test -x "$APPIMAGE"
            file "$APPIMAGE" | grep -qi 'AppImage\|ELF'
          else
            echo "WARN: AppImage not produced; shipping Linux CLI tarball only"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            dist/cypha-*-linux-x86_64.tar.gz
            dist/cypha-*-linux-x86_64.AppImage

  build-windows:
    name: Windows x86_64 package (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC + Ninja
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure + build (MSVC Release)
        shell: cmd
        run: |
          cmake -S native -B native/build-msvc-release -G Ninja -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE%
          cmake --build native/build-msvc-release --parallel

      - name: List Windows MSVC binaries (pre-package)
        shell: powershell
        run: Get-ChildItem native\build-msvc-release -Filter *.exe | Sort-Object Name | Format-Table Name,Length

      - name: Package zip
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          & .\scripts\package_release_windows.ps1 -Version $Version -BuildDir native\build-msvc-release -OutDir dist

      - name: Verify release bundle contents
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          $Archive = "dist\cypha-$Version-windows-x86_64.zip"
          $Stage = "dist\cypha-$Version-windows-x86_64"
          if (Test-Path $Stage) { Remove-Item $Stage -Recurse -Force }
          Expand-Archive -Path $Archive -DestinationPath dist -Force
          $need = @(
            'cypha_rest.exe','cypha_bench_run.exe','cypha_bench_report.exe','cypha_diagnostics_run.exe',
            'cypha_tune_run.exe','cyphalm_bench_native.exe','cypha_baseline_lock.exe',
            'baseline_lock_validate.exe','registry_register.exe','create_model_smoke.exe'
          )
          $dev = @(
            'score_batch_golden.exe','multilabel_dif_golden.exe','merge_from_golden.exe',
            'similarity_index_golden.exe','retrieval_golden.exe',
            'som_golden.exe','kernel_llr_golden.exe','gh_infer_deliberation_golden.exe',
            'cyphalm_checkpoint_golden.exe'
          )
          foreach ($b in $need) {
            if (-not (Test-Path "$Stage\bin\$b")) { throw "MISSING $Stage\bin\$b" }
          }
          foreach ($b in $dev) {
            if (-not (Test-Path "$Stage\bin\dev\$b")) { throw "MISSING $Stage\bin\dev\$b" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/cypha-*-windows-x86_64.zip

  build-macos:
    name: macOS arm64 package
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Configure + build (Release)
        run: |
          cmake -S native -B native/build-macos -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          cmake --build native/build-macos --parallel 3

      - name: Smoke hp / CyphaLM gate
        run: CYPHA_NATIVE_BUILD_DIR="$PWD/native/build-macos" bash scripts/ci_native_hp_smoke.sh

      - name: Smoke CLI (release binaries)
        run: |
          native/build-macos/cypha_bench_run --list-domains
          native/build-macos/cypha_bench_report --help
          native/build-macos/cypha_diagnostics_run --list
          native/build-macos/cypha_tune_run --help
          test -x native/build-macos/cyphalm_bench_native

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          chmod +x scripts/package_release_macos.sh packaging/install_release_macos.sh
          bash scripts/package_release_macos.sh "$VERSION" native/build-macos dist

      - name: Verify release bundle contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          case "$ARCH" in arm64|aarch64) ARCH_LABEL=arm64 ;; *) ARCH_LABEL=x86_64 ;; esac
          ARCHIVE="dist/cypha-${VERSION}-macos-${ARCH_LABEL}.tar.gz"
          test -f "$ARCHIVE"
          tar xzf "$ARCHIVE" -C dist
          STAGE="dist/cypha-${VERSION}-macos-${ARCH_LABEL}"
          for bin in cypha_rest cypha_bench_run cypha_bench_report cypha_diagnostics_run cypha_tune_run \
                     cyphalm_bench_native cypha_baseline_lock baseline_lock_validate \
                     registry_register create_model_smoke; do
            test -x "$STAGE/bin/$bin"
          done
          for bin in score_batch_golden multilabel_dif_golden merge_from_golden similarity_index_golden \
                     retrieval_golden som_golden kernel_llr_golden \
                     gh_infer_deliberation_golden cyphalm_checkpoint_golden; do
            test -x "$STAGE/bin/dev/$bin"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: dist/cypha-*-macos-*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Replaces maintainer manual `Compress-Archive paper/arxiv_bundle/*` attach after tag publish.
      - name: Package arXiv paper bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_DIR="paper/arxiv_bundle"
          test -d "$BUNDLE_DIR" || { echo "ERROR: missing $BUNDLE_DIR"; exit 1; }
          if ! test -f "$BUNDLE_DIR/CyphaLM_paper.pdf" && ! test -f "$BUNDLE_DIR/CyphaLM_paper.md"; then
            echo "ERROR: $BUNDLE_DIR must contain CyphaLM_paper.pdf and/or CyphaLM_paper.md"
            exit 1
          fi
          mkdir -p dist
          (cd "$BUNDLE_DIR" && zip -r "../../dist/cypha-${VERSION}-arxiv-bundle.zip" .)
          test -f "dist/cypha-${VERSION}-arxiv-bundle.zip"

      - name: List artifacts
        run: find dist -type f | sort

      - name: Maintainer release notes stub (optional)
        continue-on-error: true
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -File scripts/create_release_notes.ps1 -Tag "${{ github.ref_name }}" \
              > dist/maintainer_release_notes.md
            head -40 dist/maintainer_release_notes.md || true
          else
            echo "Install PowerShell (pwsh) locally to run scripts/create_release_notes.ps1"
          fi

      # softprops cannot PATCH a release created outside Actions ("Resource not accessible
      # by integration"). Delete any prior release for this tag, then create fresh.
      - name: Delete prior GitHub Release for tag (keep tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" -y || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cypha-*-linux-x86_64.tar.gz
            dist/cypha-*-linux-x86_64.AppImage
            dist/cypha-*-windows-x86_64.zip
            dist/cypha-*-macos-*.tar.gz
            dist/cypha-*-arxiv-bundle.zip
          body: |
            ## Cypha ${{ github.ref_name }} — native C++ framework

            Prebuilt **native C++** runtime only (no Python venv): Cypha REST (`/sample`, `/retrieve`, `/sequence/*`), native bench, CyphaLM (hp), diagnostics, and a **standalone Qt shell AppImage** on Linux.

            ### Linux CLI (`cypha-*-linux-x86_64.tar.gz`)

            ```bash
            tar xzf cypha-*-linux-x86_64.tar.gz
            cd cypha-*-linux-x86_64
            bash install.sh
            ```

            Requires: `libgomp1`, glibc 2.31+.

            ### Linux Qt AppImage (`cypha-*-linux-x86_64.AppImage`)

            Self-contained **`cypha_qt_shell`** with Qt libraries bundled via linuxdeploy. **`cypha_rest`** is included as a sidecar.

            ```bash
            chmod +x cypha-*-linux-x86_64.AppImage
            ./cypha-*-linux-x86_64.AppImage
            ```

            ### Windows CLI (`cypha-*-windows-x86_64.zip`)

            ```powershell
            Expand-Archive cypha-*-windows-x86_64.zip
            cd cypha-*-windows-x86_64
            powershell -ExecutionPolicy Bypass -File install.ps1
            ```

            Native **MSVC** x64 binaries (Visual Studio / VC++ redistributable on clean machines).

            ### macOS CLI (`cypha-*-macos-arm64.tar.gz`)

            Apple Silicon (arm64) CLI tools from GitHub Actions `macos-latest`.

            ```bash
            tar xzf cypha-*-macos-arm64.tar.gz
            cd cypha-*-macos-arm64
            bash install.sh
            ```

            ### Production binaries (`bin/`, on PATH after install)

            | Binary | Role |
            |--------|------|
            | `cypha_rest` | Native REST server (classifier + `/sample`, `/retrieve`, `/sequence/*`) |
            | `cypha_bench_run` | Bench master runner |
            | `cypha_bench_report` | Report-only rebuild |
            | `cypha_diagnostics_run` | Diagnostics orchestrator |
            | `cypha_tune_run` | Native tuning sweep runner |
            | `cyphalm_bench_native` | CyphaLM / hp bench CLI |
            | `cypha_baseline_lock`, `baseline_lock_validate` | Baseline lock update / validate |
            | `registry_register`, `create_model_smoke` | Registry + model creation smoke |

            ### arXiv paper bundle

            `cypha-*-arxiv-bundle.zip` — camera-ready paper + figures (see `paper/arxiv_bundle/`).
