# Native CTest + Python pytest (headless Qt + optional cypha_rest subprocess smoke).
#
# Fixture regeneration:
#   After any change to CyphaDIF._save_state / cypha_save_binary / v3 layout (adding or removing keys,
#   changing dtypes/shapes, or changing the binary encoding), regenerate ALL parity fixtures:
#     python scripts/generate_parity_fixtures.py     # re-generates parity_fixtures/{reference.cypha,
#                                                    #   native_parity.bin, memory_train/after.cypha, …}
#     python scripts/generate_memory_train_parity.py # (called above; run standalone to update just memory_train/)
#   Then commit the updated fixture files alongside the code change.
#   The following tests rely on these golden files: tests/test_parity_fixtures.py,
#   tests/test_cypha_binary_buffer_api.py, tests/test_memory_train_fixture.py.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  build_and_test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev libz-dev qt6-base-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1-mesa-dri libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-verify.txt
          pip install -e cypha_lm/
          pip install datasets
          pip install PySide6 pyqtgraph pytest-qt "ruff>=0.9,<0.10"
      - name: WikiText-2 corpus (CyphaLM D17)
        run: python -c "import sys; sys.path.insert(0,'.'); from cypha_bench.setup.acquire_data import acquire_wikitext2; acquire_wikitext2()"
      - name: Ruff
        run: ruff check cypha_studio cypha_lm cypha_bench/adapters cypha_bench/domains/d04_generation_language.py cypha_bench/domains/d17_cyphalm_integration.py tests/test_lm_api.py scripts/generate_demo_lm_checkpoint.py scripts/bench_cyphalm.py
      - name: Native build + CTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCYPHA_BUILD_QT=ON
          cmake --build native/build -j 2
          # Qt Widgets smoke needs a full desktop stack; compile-check Qt here, run parity CTests without GUI exec.
          ctest --test-dir native/build --output-on-failure -E 'native_qt_shell_smoke|native_qt_stub_load_reference'
        # Local equivalent: bash scripts/ci_native_linux.sh (optional CYPHA_BUILD_QT=1 + qt6-base-dev;
        # optional CYPHA_QT_CHARTS=1 + qt6-charts-dev for -DCYPHA_QT_CHARTS=ON; drift pytest when python3 has pytest)
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
          CYPHA_REST_BIN: ${{ github.workspace }}/native/build/cypha_rest
        run: python -m pytest tests/ cypha_lm/model/tests/ -q --ignore=tests/test_gui_qtbot.py

  mingw_cross:
    name: MinGW cross-compile (Windows PE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MinGW + CMake
        run: sudo apt-get update && sudo apt-get install -y cmake g++-mingw-w64-x86-64
      - name: Configure + build (Windows PE)
        run: |
          cmake -S native -B native/build-mingw-w64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/native/toolchains/mingw-w64-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-mingw-w64 --parallel --target all
      - name: Verify MinGW cross build (PE artifacts)
        run: |
          ls -la native/build-mingw-w64/*.exe | sort
          for bin in cypha_rest.exe cypha_bench_run.exe cypha_bench_report.exe cypha_diagnostics_run.exe cypha_tune_run.exe; do
            test -f "native/build-mingw-w64/$bin"
          done

  # MSVC + CYPHA_ENABLE_CUDA=ON compile smoke (MinGW cannot build CUDA).
  # cuda_smoke / native_cuda_smoke pass on CPU threads when the runner has no GPU;
  # native_cuda_bench (--bench) is skipped (exit 2) without a device.
  # See docs/native/ACCEL_CUDA.md
  windows_cuda_msvc:
    name: MSVC + CUDA smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA toolkit (nvcc)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.6.0"
          method: network
          # Skip Nsight VSE (GHA hang). thrust adds headers; VS integration copied manually if present.
          sub-packages: '["nvcc", "cudart", "thrust"]'

      - name: Probe GPU (informational)
        id: gpu
        shell: bash
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
            echo "has_gpu=true" >> "$GITHUB_OUTPUT"
            nvidia-smi -L || true
          else
            echo "has_gpu=false" >> "$GITHUB_OUTPUT"
            echo "No GPU on runner — native_cuda_smoke still exercises CPU thread path."
          fi

      - name: Install Ninja
        # Pin 1.12.x — newer Ninja releases have broken MSVC+CUDA on GHA (catboost/catboost#2616).
        run: choco install ninja --version 1.12.1 --allow-downgrade -y --no-progress

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure, build, and CTest (Ninja + CUDA)
        shell: pwsh
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CUDA_PATH) { throw 'CUDA_PATH missing (use cuda-toolkit step output)' }
          $nvcc = Join-Path $env:CUDA_PATH 'bin/nvcc.exe'
          if (-not (Test-Path $nvcc)) { throw "nvcc not found: $nvcc" }
          Get-Command cl | Format-List
          & $nvcc -V
          $intSrc = Join-Path $env:CUDA_PATH 'extras/visual_studio_integration/MSBuildExtensions'
          if (Test-Path $intSrc) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            if ($vs) {
              $dst = Join-Path $vs 'MSBuild/Microsoft/VC/v170/BuildCustomizations'
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              Copy-Item -Path (Join-Path $intSrc '*') -Destination $dst -Recurse -Force
              Write-Host "Copied CUDA VS integration to $dst"
            }
          }
          cmake -S native -B native/build-cuda-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCYPHA_ENABLE_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=75 `
            -DCMAKE_CUDA_COMPILER="$nvcc" `
            -DCMAKE_CUDA_HOST_COMPILER=cl `
            -DCUDAToolkit_ROOT="$env:CUDA_PATH"
          cmake --build native/build-cuda-msvc --parallel `
            --target score_batch_parity cuda_smoke cypha_core
          ctest --test-dir native/build-cuda-msvc `
            -R "native_cuda_smoke|native_score_batch" --output-on-failure

      - name: Upload CUDA build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cuda-msvc-logs
          path: |
            native/build-cuda-msvc/CMakeFiles/CMakeOutput.log
            native/build-cuda-msvc/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: CTest native_cuda_bench (GPU only)
        if: steps.gpu.outputs.has_gpu == 'true'
        continue-on-error: true
        shell: pwsh
        run: ctest --test-dir native/build-cuda-msvc -R native_cuda_bench --output-on-failure

  # Optional Linux nvcc compile smoke; does not block PRs when CUDA install or link fails.
  linux_cuda:
    name: GCC + CUDA smoke (Linux, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA toolkit (nvcc)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc"]'

      - name: Install Ninja + GCC
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Probe GPU (informational)
        id: gpu
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
            echo "has_gpu=true" >> "$GITHUB_OUTPUT"
            nvidia-smi -L || true
          else
            echo "has_gpu=false" >> "$GITHUB_OUTPUT"
            echo "No GPU on runner — native_cuda_smoke still exercises CPU thread path."
          fi

      - name: Configure + build
        run: |
          cmake -S native -B native/build-cuda-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYPHA_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75
          cmake --build native/build-cuda-linux --parallel \
            --target score_batch_parity cuda_smoke cypha_core

      - name: CTest native_cuda_smoke + native_score_batch
        run: ctest --test-dir native/build-cuda-linux -R "native_cuda_smoke|native_score_batch" --output-on-failure

      - name: CTest native_cuda_bench (GPU only)
        if: steps.gpu.outputs.has_gpu == 'true'
        continue-on-error: true
        run: ctest --test-dir native/build-cuda-linux -R native_cuda_bench --output-on-failure
